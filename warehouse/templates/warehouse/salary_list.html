{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>💸 Выплаты Зарплат</h2>
    <a href="{% url 'salary_create' %}" class="btn btn-success">➕ Выплатить Зарплату</a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Сотрудник</th>
                    <th>Сумма</th>
                    <th>Дата Выплаты</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.employee }}</td>
                    <td>{{ item.amount|floatformat:"2g" }} KGS</td>
                    <td>{{ item.date|date:"d.m.Y H:i" }}</td>
                    <td>
                        <a href="{% url 'salary_update' pk=item.pk %}" class="btn btn-sm btn-primary">✏️</a>
                        <a href="{% url 'salary_delete' pk=item.pk %}" class="btn btn-sm btn-danger">🗑️</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center text-muted">Список пуст.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
