{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>👥 Сотрудники</h2>
    <a href="{% url 'employee_create' %}" class="btn btn-success">➕ Добавить</a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ФИО</th>
                    <th>Должность</th>
                    <th>Оклад</th>
                    <th>Телефон</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.full_name }}</td>
                    <td>{{ item.position }}</td>
                    <td>{{ item.salary }} KGS</td>
                    <td>{{ item.phone|default:"-" }}</td>
                    <td>
                        <a href="{% url 'employee_update' pk=item.pk %}" class="btn btn-sm btn-primary">✏️</a>
                        <a href="{% url 'employee_delete' pk=item.pk %}" class="btn btn-sm btn-danger">🗑️</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" class="text-center text-muted">Список пуст.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
