{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>👕 Готовая продукция</h2>
    <a href="{% url 'finished_product_create' %}" class="btn btn-success">➕ Добавить</a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Наименование</th>
                    <th>Ед. изм.</th>
                    <th>Остаток</th>
                    <th>Общ. стоимость</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.name }}</td>
                    <td>{{ item.unit }}</td>
                    <td>{{ item.quantity }}</td>
                    <td>{{ item.amount }} KGS</td>
                    <td>
                        <a href="{% url 'finished_product_update' pk=item.pk %}" class="btn btn-sm btn-primary">✏️</a>
                        <a href="{% url 'finished_product_delete' pk=item.pk %}" class="btn btn-sm btn-danger">🗑️</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" class="text-center text-muted">Список пуст.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
