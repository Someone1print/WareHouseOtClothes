{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4>⚠️ Подтверждение удаления</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead">Вы уверены, что хотите удалить объект: <strong>{{ item }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">🗑️ Да, удалить</button>
                    <a href="javascript:history.back()" class="btn btn-secondary">❌ Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
